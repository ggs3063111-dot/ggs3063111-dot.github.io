  // —— 日期选择工具条 ——
  const days=[...new Set(full.iso.map(s=>s.slice(0,10)))].sort();
  const minDay=days[0], maxDay=days[days.length-1];
  let fromDay=days[Math.max(0,days.length-5)], toDay=maxDay;
  const tools=document.createElement("div"); tools.className="tools";
  const t0=document.createElement("span"); t0.textContent="区间"; tools.appendChild(t0);
  const inFrom=document.createElement("input"); inFrom.type="date"; inFrom.min=minDay; inFrom.max=maxDay; inFrom.value=fromDay;
  const t1=document.createElement("span"); t1.textContent="至";
  const inTo=document.createElement("input"); inTo.type="date"; inTo.min=minDay; inTo.max=maxDay; inTo.value=toDay;
  tools.appendChild(inFrom); tools.appendChild(t1); tools.appendChild(inTo);
  const QUICK=[["最近5日",5],["最近20日",20],["今年以来",0]];
  const qbtns=[];
  QUICK.forEach(([txt,k])=>{const b=document.createElement("span");b.className="qbtn";b.textContent=txt;
    b.onclick=()=>setQuick(k); tools.appendChild(b); qbtns.push([b,k]);});
  const cnt=document.createElement("span"); cnt.className="cnt"; tools.appendChild(cnt);
  card.appendChild(tools);

  const leg=document.createElement("div"); leg.className="legend"; card.appendChild(leg);
  const cw=document.createElement("div"); cw.className="cvwrap";
  const cv=document.createElement("canvas"); const tt=document.createElement("div"); tt.className="tt";
  cw.appendChild(cv); cw.appendChild(tt); card.appendChild(cw);
  const note=document.createElement("div"); note.className="note";
  note.innerHTML='三联图：①价格（底色=真实持仓 <span class="rd">红持多</span>/<span class="gr">绿持空</span>/灰空仓，'+
    '▲建多 ▼建空 ✕平仓，紫色虚线=状态切换）；②综合评分柱（<span style="color:#1f6feb">蓝正</span>/<span style="color:#f0883e">橙负</span>）'+
    '<span class="rd">红阶梯=多头评分线</span>，绿虚线=空头评分线；还需状态允许及RSI等条件，熊市趋势禁开多、牛市禁开空。③六大因子并排柱。悬停看逐根数值，点图例开关因子。';
  card.appendChild(note); root.appendChild(card);

  const hidden=new Set();   // 仅作用于第③面板（因子分解）
  FN.forEach((nm,i)=>{const c=document.createElement("span");c.className="chip";
    c.innerHTML=`<span class="sw" style="background:${FC[i]}"></span>${nm}`;
    c.onclick=()=>{hidden.has(i)?hidden.delete(i):hidden.add(i);c.classList.toggle("off");draw();};
    leg.appendChild(c);});

  let data=null, n=0, geo=null;
  const PADL=52, PADR=16, TITLE=18, XAX=22, GAP=8;

  function slice(){ // 按选定区间切片当前视图（含成交标记对齐到切片下标）
    const idx=[];
    for(let i=0;i<full.iso.length;i++){const d=full.iso[i].slice(0,10);if(d>=fromDay&&d<=toDay)idx.push(i);}
    const pick=a=>idx.map(i=>a[i]);
    data={t:pick(full.t),iso:pick(full.iso),c:pick(full.c),r:pick(full.r),
          s:pick(full.s),th:pick(full.th),p:pick(full.p),f:pick(full.f)};
    n=data.t.length;
    const pos=new Map(data.iso.map((s,ix)=>[s,ix]));
    data.marks=(full.marks||[]).filter(m=>{const d=m.iso.slice(0,10);return d>=fromDay&&d<=toDay;})
                 .map(m=>({...m,x:pos.has(m.iso)?pos.get(m.iso):-1})).filter(m=>m.x>=0);
    cnt.textContent=n?`${data.iso[0].slice(0,10)} ~ ${data.iso[n-1].slice(0,10)} · ${n} ${is60?'根':'个交易日'}`:'该区间无数据';
  }
  function markQuick(k){qbtns.forEach(([b,kk])=>b.classList.toggle("on",kk===k));}
  function setQuick(k){toDay=maxDay;fromDay=k>0?days[Math.max(0,days.length-k)]:minDay;
    inFrom.value=fromDay;inTo.value=toDay;markQuick(k);rebuild();}
  function rebuild(){slice();draw();}
  inFrom.onchange=()=>{fromDay=inFrom.value;if(fromDay>toDay){toDay=fromDay;inTo.value=toDay;}markQuick(-1);rebuild();};
  inTo.onchange=()=>{toDay=inTo.value;if(toDay<fromDay){fromDay=toDay;inFrom.value=fromDay;}markQuick(-1);rebuild();};

  function layout(){
    const W=cw.clientWidth||1000, H=760, dpr=window.devicePixelRatio||1;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
    const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    const x0=PADL, x1=W-PADR, bw=(x1-x0)/Math.max(n,1);
    const plotTotal=H - TITLE*3 - XAX - GAP*2;
    const hA=plotTotal*1.4/4, hB=plotTotal*1.3/4, hC=plotTotal*1.3/4;
    let y=TITLE; const A={top:y,bot:y+hA,ty:y-5}; y=A.bot+GAP+TITLE;
    const B={top:y,bot:y+hB,ty:y-5}; y=B.bot+GAP+TITLE;
    const C={top:y,bot:y+hC,ty:y-5};
    geo={W,H,ctx,x0,x1,bw,A,B,C};
  }
  function panelTitle(txt,ty){const {ctx,x0}=geo;ctx.fillStyle="#3b4149";ctx.font="12px sans-serif";
    ctx.textAlign="left";ctx.fillText(txt,x0,ty);}
  function yTicks(reg,lo,hi,step){const {ctx,x0,x1}=geo;const yf=v=>reg.bot-(v-lo)/(hi-lo)*(reg.bot-reg.top);
    ctx.font="10px sans-serif";ctx.textAlign="right";
    for(let g=Math.ceil(lo/step)*step;g<=hi;g+=step){const y=yf(g);
      ctx.strokeStyle="#eef1f4";ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
      ctx.fillStyle="#8a929b";ctx.fillText(Math.round(g),x0-5,y+3);}}
  function legChips(reg,items){const {ctx,x1}=geo;ctx.font="11px sans-serif";ctx.textAlign="left";
    let lx=x1; const parts=items.map(it=>({...it,w:ctx.measureText(it.t).width+22}));
    const tot=parts.reduce((s,p)=>s+p.w,0); lx=x1-tot;
    for(const p of parts){const y=reg.top+11;
      if(p.line){ctx.strokeStyle=p.c;ctx.lineWidth=p.dash?1.4:2;ctx.setLineDash(p.dash?[4,3]:[]);
        ctx.beginPath();ctx.moveTo(lx,y-3);ctx.lineTo(lx+14,y-3);ctx.stroke();ctx.setLineDash([]);}
      else{ctx.fillStyle=p.c;ctx.globalAlpha=p.a||1;ctx.fillRect(lx,y-9,12,10);ctx.globalAlpha=1;}
      ctx.fillStyle="#5a636d";ctx.fillText(p.t,lx+16,y);lx+=p.w;}}

  function draw(){
    layout(); const {ctx,W,H,x0,x1,bw,A,B,C}=geo;
    ctx.clearRect(0,0,W,H);
    if(!n){ctx.fillStyle="#6a737d";ctx.font="13px sans-serif";ctx.textAlign="center";
      ctx.fillText("该区间无数据，请调整日期",W/2,H/2);return;}
    const cxOf=i=>x0+i*bw+bw/2;

    // ===== ① 价格 + 持仓底色 + 状态切换线 + 建平仓标记 =====
    panelTitle("① 价格 · 真实持仓底色 · 实际建平仓标记　状态："+[...new Set(data.r)].join("／"), A.ty);
    for(let i=0;i<n;i++){const p=data.p[i];
      ctx.fillStyle=p>0?"rgba(207,36,46,.16)":(p<0?"rgba(45,164,78,.16)":"rgba(233,236,239,.7)");
      ctx.fillRect(x0+i*bw,A.top,bw+.5,A.bot-A.top);}
    for(let i=1;i<n;i++){if(data.r[i]!==data.r[i-1]){ctx.strokeStyle=PURPLE;ctx.lineWidth=1.1;
      ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(x0+i*bw,A.top);ctx.lineTo(x0+i*bw,A.bot);ctx.stroke();ctx.setLineDash([]);}}
    let pmin=1e9,pmax=-1e9;for(const v of data.c){pmin=Math.min(pmin,v);pmax=Math.max(pmax,v);}
    const pad=(pmax-pmin)*0.12||0.1; pmin-=pad; pmax+=pad;
    const yA=v=>A.bot-(v-pmin)/(pmax-pmin)*(A.bot-A.top);
    ctx.font="10px sans-serif";ctx.textAlign="right";
    for(const g of [pmax,(pmax+pmin)/2,pmin]){const y=yA(g);ctx.fillStyle="#8a929b";ctx.fillText(g.toFixed(2),x0-5,y+3);}
    ctx.strokeStyle="#111";ctx.lineWidth=1.4;ctx.beginPath();
    for(let i=0;i<n;i++){const x=cxOf(i),y=yA(data.c[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
    const ms=n<=40?4.5:2.5;
    for(let i=0;i<n;i++){ctx.fillStyle="#111";ctx.beginPath();ctx.arc(cxOf(i),yA(data.c[i]),ms,0,7);ctx.fill();}
    for(const m of data.marks){const x=cxOf(m.x),y=yA(m.price);
      const col=m.open?(m.long?RED:GREEN):"#111";
      ctx.fillStyle=col;ctx.strokeStyle="#000";ctx.lineWidth=.6;ctx.beginPath();
      if(!m.open){ctx.moveTo(x-5,y-5);ctx.lineTo(x+5,y+5);ctx.moveTo(x+5,y-5);ctx.lineTo(x-5,y+5);
        ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.stroke();}
      else if(m.long){ctx.moveTo(x,y-8);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();ctx.stroke();}
      else{ctx.moveTo(x,y+8);ctx.lineTo(x-6,y-4);ctx.lineTo(x+6,y-4);ctx.closePath();ctx.fill();ctx.stroke();}
      ctx.fillStyle=col;ctx.font="bold 9px sans-serif";ctx.textAlign="center";
      ctx.fillText(m.label, x, m.open?y+(m.long?18:-11):y-9);
      ctx.fillText(m.price.toFixed(2), x, m.open?y+(m.long?27:-20):y+ (y>A.top+20?-18:18));}
    legChips(A,[{t:"持多",c:RED,a:.5},{t:"持空",c:GREEN,a:.5},{t:"空仓",c:"#e9ecef",a:1}]);

    // ===== ② 综合评分 vs 阶梯阈值 =====
    panelTitle("② 综合评分 · 多空评分线（还需状态权限及RSI等条件）", B.ty);
    let thmax=0,smax=-1e9,smin=1e9;
    for(let i=0;i<n;i++){thmax=Math.max(thmax,data.th[i]);smax=Math.max(smax,data.s[i]);smin=Math.min(smin,data.s[i]);}
    const bTop=Math.max(thmax*1.2,smax*1.3,15), bBot=Math.min(-thmax*1.2,smin*1.3,-5);
    const yB=v=>B.bot-(v-bBot)/(bTop-bBot)*(B.bot-B.top);
    yTicks(B,bBot,bTop,10);
    const zB=yB(0);
    const bwv=Math.max(bw*0.62,1);
    for(let i=0;i<n;i++){const v=data.s[i],x=cxOf(i)-bwv/2,y=yB(v);
      ctx.fillStyle=v>=0?BLUE:ORANGE;ctx.fillRect(x,Math.min(y,zB),bwv,Math.abs(y-zB));}
    ctx.strokeStyle="#888";ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x0,zB);ctx.lineTo(x1,zB);ctx.stroke();
    // 阶梯：开多阈值(红实) / 开空阈值(绿虚)
    const step=(sign,color,dash,lw)=>{ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.setLineDash(dash?[5,3]:[]);
      ctx.beginPath();for(let i=0;i<n;i++){const xa=x0+i*bw,xb=xa+bw,y=yB(sign*data.th[i]);
        if(i===0)ctx.moveTo(xa,y);else ctx.lineTo(xa,y);ctx.lineTo(xb,y);}ctx.stroke();ctx.setLineDash([]);};
    step(1,RED,false,1.8); step(-1,GREEN,true,1.2);
    legChips(B,[{t:"开多阈值",c:RED,line:true},{t:"开空阈值(熊市)",c:GREEN,line:true,dash:true}]);

    // ===== ③ 六大因子并排柱 =====
    panelTitle("③ 六大因子板块贡献分解（正=偏多 / 负=偏空）", C.ty);
    const vis=[];for(let k=0;k<6;k++)if(!hidden.has(k))vis.push(k);
    let fmx=1,fmn=-1;for(let i=0;i<n;i++)for(const k of vis){const v=data.f[i][k];fmx=Math.max(fmx,v);fmn=Math.min(fmn,v);}
    fmx*=1.12;fmn*=1.12;
    const yC=v=>C.bot-(v-fmn)/(fmx-fmn)*(C.bot-C.top);
    yTicks(C,fmn,fmx,5);
    const zC=yC(0);
    ctx.strokeStyle="#888";ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x0,zC);ctx.lineTo(x1,zC);ctx.stroke();
    const gw=bw*0.82, w=vis.length?gw/vis.length:gw;
    for(let i=0;i<n;i++){const gx=cxOf(i)-gw/2;
      vis.forEach((k,j)=>{const v=data.f[i][k],x=gx+j*w,y=yC(v);
        ctx.fillStyle=FC[k];ctx.fillRect(x,Math.min(y,zC),Math.max(w-0.6,0.6),Math.abs(y-zC));});}

    // ===== 共享 x 轴标签 + 竖向对齐网格 =====
    ctx.textAlign="center";ctx.font="10px sans-serif";let last="";
    for(let i=0;i<n;i++){const iso=data.iso[i];let show=false,lab="";
      if(is60){if(iso.slice(0,10)!==last){show=true;last=iso.slice(0,10);lab=iso.slice(5,10);}}
      else if(n<=30){show=true;lab=iso.slice(5,10);}
      else if(iso.slice(0,7)!==last){show=true;last=iso.slice(0,7);lab=iso.slice(0,7);}
      if(show){const x=cxOf(i);ctx.fillStyle="#8a929b";ctx.fillText(lab,x,H-6);
        ctx.strokeStyle="#f0f2f5";ctx.beginPath();ctx.moveTo(x,A.top);ctx.lineTo(x,C.bot);ctx.stroke();}}
  }

  cv.addEventListener("mousemove",e=>{
    if(!geo||!n)return;const r=cv.getBoundingClientRect();const mp=e.clientX-r.left;
    let i=Math.floor((mp-geo.x0)/geo.bw); if(i<0||i>=n){tt.style.display="none";return;}
    draw(); const {ctx,A,C}=geo; const cx=geo.x0+i*geo.bw+geo.bw/2;
    ctx.strokeStyle="rgba(0,0,0,.32)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx,A.top);ctx.lineTo(cx,C.bot);ctx.stroke();ctx.setLineDash([]);
    let rows="";for(let k=0;k<6;k++){if(hidden.has(k))continue;const v=data.f[i][k];
      rows+=`<div><span class="sw" style="background:${FC[k]}"></span> ${FN[k]}: <b>${v>=0?"+":""}${v}</b></div>`;}
    const pos=data.p[i]>0?'<span class="rd">持多</span>':(data.p[i]<0?'<span class="gr">持空</span>':'空仓');
    tt.innerHTML=`<b>${data.t[i]}</b>　<span class="k">${data.r[i]}</span><br>`+
      `价 <b>${data.c[i]}</b>　持仓 ${pos}<br>`+
      `综合评分 <b>${data.s[i]>=0?"+":""}${data.s[i]}</b> ／ 评分线 ±${data.th[i]}（状态权限另过滤）<br>`+
      `<div style="margin-top:4px">${rows}</div>`;
    tt.style.display="block";
    let tx=mp+14; if(tx>geo.W-190)tx=mp-196; tt.style.left=tx+"px"; tt.style.top="34px";
  });
  cv.addEventListener("mouseleave",()=>{tt.style.display="none";draw();});
  window.addEventListener("resize",draw);

  setQuick(5); // 默认：最近 5 个交易日
}
document.querySelectorAll("[data-chart]").forEach(el=>{
  const key=el.getAttribute("data-chart");
  makeChart(el, DATA[key], DATA.meta[key].title, DATA.meta[key].sub);
});
</script>
